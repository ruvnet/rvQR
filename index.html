<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>rvQR</title>
  <meta http-equiv="refresh" content="0; url=./artifacts/">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #0b0f14;
      color: #e6edf6;
    }
    .container {
      text-align: center;
      background: #121821;
      border: 1px solid #24303f;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.35);
    }
    h1 {
      margin: 0 0 1rem 0;
      color: inherit;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0 0 1.5rem 0;
      color: #8b9bb0;
    }
    a {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: #2dd4bf;
      color: #06231f;
      text-decoration: none;
      border-radius: 4px;
      font-weight: 500;
      transition: background 0.2s;
    }
    a:hover {
      background: #5eead4;
    }
    @media (prefers-color-scheme: light) {
      body { background: #f6f8fb; color: #101720; }
      .container { background: #ffffff; border-color: #dbe3ed; box-shadow: 0 2px 10px rgba(16,23,32,.08); }
      p { color: #5b6b7f; }
      a { background: #0d9488; color: #ffffff; }
      a:hover { background: #0f766e; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>rv<span style="color:#2dd4bf">QR</span></h1>
    <p>Redirecting to the Artifacts UI...</p>
    <a href="./artifacts/">Open the rvQR Artifacts UI</a>
  </div>
</body>
</html>
